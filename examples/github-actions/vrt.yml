name: VRT
on: [pull_request]
permissions:
  contents: read
jobs:
  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run vrt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-failure-artifacts
          path: |
            vrt/test-results
            vrt/playwright-report
